<dialog
  #dialog
  class="newsletter-popup"
  aria-labelledby="newsletter-title"
  (close)="onClosed()"
  (click)="onBackdropClick($event)"
>
  <button type="button" class="newsletter-close" aria-label="Close" (click)="close()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>

  <img src="assets/logos/title.svg" alt="" class="newsletter-logo" />

  @if (subscribed()) {
    <h2 id="newsletter-title" class="newsletter-title">Thank you!</h2>
    <p>You've joined our mailing list. We'll be in touch soon.</p>
    <button type="button" class="contact-button contact-button--book newsletter-submit" (click)="close()">
      Close
    </button>
    <button type="button" class="newsletter-no-thanks newsletter-again" (click)="signUpAgain()">
      Sign up with a different email
    </button>
  } @else {
    <h2 id="newsletter-title" class="newsletter-title">Join our mailing list</h2>
    <p>Be the first to hear about new events, classes and news from The Marlborough Playhouse.</p>

    <app-newsletter-form (subscribed)="subscribed.set(true)" />

    <p class="newsletter-small">You can unsubscribe at any time.</p>
    <button type="button" class="newsletter-no-thanks" (click)="close()">No thanks</button>
  }
</dialog>
