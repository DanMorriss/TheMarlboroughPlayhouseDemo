<nav class="navbar">
  <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center px-4 py-2 md:px-[60px] md:py-[20px]">
    <div></div>

    <a routerLink="/home" class="shrink-0 justify-self-center" (click)="closeMenu()">
      <img
        src="assets/logos/title.svg"
        alt="The Marlborough Playhouse Logo"
        class="h-[70px] w-auto md:h-[150px]"
      />
    </a>

    <div class="flex flex-row items-center justify-end">
      <!-- Mobile menu toggle -->
      <button
        type="button"
        class="menu-button md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle navigation menu"
      >
        <!-- Three lines that animate into an X when the menu is open -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          stroke-linecap="round"
          class="menu-icon"
          [class.menu-icon--open]="menuOpen()"
          aria-hidden="true"
        >
          <path class="menu-icon-top" d="M3.75 6.75h16.5" />
          <path class="menu-icon-middle" d="M3.75 12h16.5" />
          <path class="menu-icon-bottom" d="M3.75 17.25h16.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Desktop Nav -->
  <ul class="desktop-nav-list hidden md:flex flex-row items-center justify-center list-none">
    <li class="links">
      <a routerLink="/home">
        <span class="rainbow-text nav-image">HOME</span>
      </a>
    </li>
    <li class="links">
      <a routerLink="/home" fragment="plan-your-visit">
        <span class="rainbow-text nav-image">PLAN YOUR VISIT</span>
      </a>
    </li>
    <li class="links">
      <a routerLink="/home" fragment="private-hire">
        <span class="rainbow-text nav-image">PRIVATE HIRE</span>
      </a>
    </li>
    <li class="links">
      <a routerLink="/home" fragment="contact">
        <span class="rainbow-text nav-image">CONTACT</span>
      </a>
    </li>
    <li class="links">
      <a routerLink="/booking">
        <span class="rainbow-text nav-image">EVENTS</span>
      </a>
    </li>
  </ul>

  <!-- Mobile Nav: always rendered so it can slide open and closed; inert while closed -->
  <div
    id="mobile-nav"
    class="mobile-nav"
    [class.mobile-nav--open]="menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <div class="mobile-nav-clip">
      <ul class="mobile-nav-list list-none">
        <li>
          <a routerLink="/home" (click)="closeMenu()">
            <span class="rainbow-text nav-image-mobile">HOME</span>
          </a>
        </li>
        <li>
          <a routerLink="/home" fragment="plan-your-visit" (click)="closeMenu()">
            <span class="rainbow-text nav-image-mobile">PLAN YOUR VISIT</span>
          </a>
        </li>
        <li>
          <a routerLink="/home" fragment="private-hire" (click)="closeMenu()">
            <span class="rainbow-text nav-image-mobile">PRIVATE HIRE</span>
          </a>
        </li>
        <li>
          <a routerLink="/home" fragment="contact" (click)="closeMenu()">
            <span class="rainbow-text nav-image-mobile">CONTACT</span>
          </a>
        </li>
        <li>
          <a routerLink="/booking" (click)="closeMenu()">
            <span class="rainbow-text nav-image-mobile">EVENTS</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
